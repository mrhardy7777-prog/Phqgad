<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>استبيان PRIME-MD</title>
<style>
:root{--bg:#f2f7fa;--card:#fff;--ink:#12303d;--mute:#5d7480;--line:#d6e3ea;--pri:#1b8fc0;--pri2:#0e5f86;--sel:#e3f3fa;--warn:#b42318;--warnbg:#fdecea;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1a21;--card:#162630;--ink:#e6f1f6;--mute:#93a9b4;--line:#2a3f4b;--pri:#4cb5e0;--pri2:#7cc9ea;--sel:#1d3a49;--warn:#ff8a80;--warnbg:#3a1d1b}}
:root[data-theme="dark"]{--bg:#0e1a21;--card:#162630;--ink:#e6f1f6;--mute:#93a9b4;--line:#2a3f4b;--pri:#4cb5e0;--pri2:#7cc9ea;--sel:#1d3a49;--warn:#ff8a80;--warnbg:#3a1d1b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 -apple-system,"Segoe UI",Tahoma,"Noto Naskh Arabic",Arial,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:16px}
header{background:#fff;border-radius:14px;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;border:1px solid var(--line)}
header img{max-width:100%;width:290px;height:auto;display:block}
button{font:inherit;cursor:pointer}
.lang{background:var(--pri);color:#fff;border:0;border-radius:20px;padding:6px 16px;font-weight:600}
h1{font-size:1.3rem;margin:20px 0 4px;color:var(--pri2)}
.sub{color:var(--mute);margin:0 0 14px;font-size:.92rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:14px 0}
.card h2{margin:0 0 4px;font-size:1.1rem;color:var(--pri2)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:520px){.row{grid-template-columns:1fr}}
label.f{display:block;font-size:.85rem;color:var(--mute)}
input[type=text],input[type=date]{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
.q{padding:12px 0;border-top:1px solid var(--line)}
.q:first-of-type{border-top:0}
.q p{margin:0 0 8px;font-weight:500}
.q p b{color:var(--pri2);margin-inline-end:6px}
.opts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
@media(max-width:520px){.opts{grid-template-columns:1fr 1fr}}
.opts label{border:1px solid var(--line);border-radius:10px;padding:8px 4px;text-align:center;font-size:.82rem;cursor:pointer;background:var(--bg);display:flex;align-items:center;justify-content:center;min-height:44px}
.opts input{position:absolute;opacity:0;pointer-events:none}
.opts label:has(input:checked){background:var(--sel);border-color:var(--pri);color:var(--pri2);font-weight:700}
.q.miss{outline:2px solid var(--warn);outline-offset:2px;border-radius:8px}
.go{width:100%;background:var(--pri2);color:#fff;border:0;border-radius:12px;padding:14px;font-weight:700;font-size:1.05rem;margin-top:6px}
.alert{background:var(--warnbg);color:var(--warn);border:1px solid var(--warn);border-radius:10px;padding:10px 12px;margin:10px 0;font-weight:600}
.score{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.score .n{font-size:2.2rem;font-weight:800;color:var(--pri2)}
.bar{height:12px;border-radius:6px;background:linear-gradient(90deg,#4caf50,#c6d630,#ffb300,#f4511e,#b71c1c);position:relative;margin:10px 0 4px}
.bar i{position:absolute;top:-4px;width:6px;height:20px;background:var(--ink);border-radius:3px;transform:translateX(-50%)}
.sc{display:flex;justify-content:space-between;font-size:.72rem;color:var(--mute)}
.note{font-size:.82rem;color:var(--mute)}
.acts{display:flex;gap:8px;margin-top:10px}
.acts button{flex:1;padding:10px;border-radius:10px;border:1px solid var(--pri);background:transparent;color:var(--pri2);font-weight:600}
[hidden]{display:none!important}
@media print{body{background:#fff;color:#000}.lang,.go,.acts,#form{display:none}header{border:0}}
</style>
</head>

res:"النتائج",score:"الدرجة",sev:"الشدة",flag:"⚠ البند 9 إيجابي (أفكار الموت أو إيذاء النفس). يجب إجراء تقييم مباشر لخطر الانتحار الآن.",
pos:"فحص إيجابي (≥10): يوصى بالتقييم السريري لتأكيد التشخيص.",neg:"أقل من حد الفحص (<10).",
phqS:["أدنى","خفيف","متوسط","متوسط إلى شديد","شديد"],gadS:["أدنى","خفيف","متوسط","شديد"],
fnR:"الصعوبة الوظيفية",print:"طباعة / حفظ PDF",redo:"البدء من جديد",
disc:"أداة فحص فقط ولا تُثبت التشخيص؛ ويتطلب التفسير حكماً سريرياً.",
phq:["قلة الاهتمام أو الاستمتاع بالقيام بالأشياء","الشعور بالحزن أو الاكتئاب أو اليأس","صعوبة في النوم أو الاستمرار فيه، أو النوم أكثر من اللازم","الشعور بالتعب أو قلة الطاقة","ضعف الشهية أو الإفراط في الأكل","الشعور بالسوء تجاه نفسك، أو أنك فاشل أو أنك خذلت نفسك أو أسرتك","صعوبة التركيز على الأشياء، مثل قراءة الجريدة أو مشاهدة التلفاز","التحرك أو التحدث ببطء شديد بحيث يلاحظ الآخرون ذلك؟ أو العكس: التوتر والتململ بحيث تتحرك أكثر من المعتاد","أفكار بأنك ستكون أفضل حالاً لو كنت ميتاً، أو بإيذاء نفسك بطريقة ما"],
gad:["الشعور بالعصبية أو القلق أو التوتر","عدم القدرة على التوقف عن القلق أو السيطرة عليه","القلق المفرط بشأن أمور مختلفة","صعوبة في الاسترخاء","التململ لدرجة يصعب معها الجلوس بهدوء","الانزعاج أو الانفعال بسهولة","الشعور بالخوف كأن شيئاً فظيعاً قد يحدث"]}};
let lg="ar";const A={phq:[],gad:[],fn:null};
const $=i=>document.getElementById(i);
function block(key,items,t){
 return `<h2>${t[key+"T"]}</h2><p class="sub">${t.over}</p>`+items.map((q,i)=>
 `<div class="q" id="${key}${i}"><p><b>${i+1}.</b>${q}</p><div class="opts">`+t.opts.map((o,v)=>
 `<label><input type="radio" name="${key}${i}" value="${v}" ${A[key][i]===v?"checked":""}>${o}</label>`).join("")+`</div></div>`).join("");
}
function render(){
 const t=T[lg];document.documentElement.lang=lg;document.documentElement.dir=t.dir;
 $("ttl").textContent=t.ttl;$("sub").textContent=t.sub;
 $("go").textContent=t.go;$("disc").textContent=t.disc;
 $("c-phq").innerHTML=block("phq",t.phq,t);$("c-gad").innerHTML=block("gad",t.gad,t);
 $("c-fn").innerHTML=`<h2>${t.fnT}</h2><div class="q" id="fn"><p>${t.fnQ}</p><div class="opts">`+t.fn.map((o,v)=>
 `<label><input type="radio" name="fn" value="${v}" ${A.fn===v?"checked":""}>${o}</label>`).join("")+`</div></div>`;
 if(!$("res").hidden)results();
}
document.addEventListener("change",e=>{
 const n=e.target.name;if(!n)return;const v=+e.target.value;
 if(n==="fn")A.fn=v;else A[n.slice(0,3)][+n.slice(3)]=v;
 const el=$(n);if(el)el.classList.remove("miss");
});
const sum=a=>a.reduce((x,y)=>x+(y||0),0);
function bandPHQ(s){return s<5?0:s<10?1:s<15?2:s<20?3:4}
function bandGAD(s){return s<5?0:s<10?1:s<15?2:3}
function module(t,title,s,max,idx,labels){
 const pct=s/max*100,pos=s>=10;
 return `<div class="card"><h2>${title}</h2><div class="score"><span class="n">${s}</span><span>/ ${max}</span><b>· ${labels[idx]}</b></div>
 <div class="bar"><i style="inset-inline-start:${pct}%"></i></div>
 <div class="sc"><span>0</span><span>${max}</span></div>
 <p style="margin:10px 0 0;font-weight:600;color:${pos?"var(--warn)":"inherit"}">${pos?t.pos:t.neg}</p></div>`;
}
function results(){
 const t=T[lg],p=sum(A.phq),g=sum(A.gad);
 let h=`<h1>${t.res}</h1>`;
 if(A.phq[8]>0)h+=`<div class="alert">${t.flag}</div>`;
 h+=module(t,t.phqT,p,27,bandPHQ(p),t.phqS)+module(t,t.gadT,g,21,bandGAD(g),t.gadS);
 h+=`<div class="card"><h2>${t.fnR}</h2><b>${t.fn[A.fn]}</b></div>`;
 h+=`<div class="acts"><button type="button" onclick="window.print()">${t.print}</button><button type="button" id="redo">${t.redo}</button></div>`;
 $("res").innerHTML=h;$("res").hidden=false;$("form").hidden=true;
 $("redo").onclick=()=>{A.phq=[];A.gad=[];A.fn=null;$("res").hidden=true;$("form").hidden=false;render();scrollTo(0,0)};
 scrollTo(0,0);
}
$("go").onclick=()=>{
 let first=null;
 [["phq",9],["gad",7]].forEach(([k,n])=>{for(let i=0;i<n;i++)if(A[k][i]==null){const e=$(k+i);e.classList.add("miss");first=first||e}});
 if(A.fn==null){$("fn").classList.add("miss");first=first||$("fn")}
 if(first){first.scrollIntoView({behavior:"smooth",block:"center"});return}
 results();
};
render();
</script>
</body>
</html>
